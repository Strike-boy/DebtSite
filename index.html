<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DebtBook — Учёт долгов</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3248;
    --accent: #4f8ef7;
    --accent-dim: rgba(79,142,247,0.13);
    --danger: #f76f6f;
    --danger-dim: rgba(247,111,111,0.13);
    --success: #4fd18e;
    --success-dim: rgba(79,209,142,0.13);
    --warn: #f7c04f;
    --text: #e8eaf2;
    --muted: #7a7f99;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ─── LAYOUT ─── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ─── SIDEBAR ─── */
  #sidebar {
    width: 260px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sidebar-logo {
    padding: 24px 20px 16px;
    font-size: 20px; font-weight: 700;
    letter-spacing: -0.5px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: grid; place-items: center;
    font-size: 16px;
  }
  .sidebar-search {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  .sidebar-section-label {
    padding: 12px 16px 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }
  #client-list {
    flex: 1; overflow-y: auto;
    padding: 4px 8px;
  }
  #client-list::-webkit-scrollbar { width: 4px; }
  #client-list::-webkit-scrollbar-track { background: transparent; }
  #client-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .client-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }
  .client-item:hover { background: var(--surface2); }
  .client-item.active { background: var(--accent-dim); }
  .client-item-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .client-item-debt {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    padding: 2px 7px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .debt-positive { color: var(--danger); background: var(--danger-dim); }
  .debt-zero { color: var(--muted); }

  .sidebar-add-btn {
    margin: 12px;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .sidebar-add-btn:hover { opacity: 0.85; }

  /* ─── MAIN ─── */
  #main {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  #main::-webkit-scrollbar { width: 6px; }
  #main::-webkit-scrollbar-track { background: transparent; }
  #main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ─── WELCOME ─── */
  #welcome {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; padding: 40px;
    text-align: center;
  }
  .welcome-icon { font-size: 56px; }
  .welcome-title { font-size: 26px; font-weight: 700; }
  .welcome-sub { color: var(--muted); font-size: 15px; max-width: 320px; line-height: 1.6; }

  /* ─── CLIENT VIEW ─── */
  #client-view { flex: 1; padding: 32px; max-width: 760px; }

  .cv-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  .cv-name { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .cv-meta { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .cv-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    padding: 9px 16px;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }
  .btn-debt { background: var(--danger-dim); color: var(--danger); }
  .btn-pay  { background: var(--success-dim); color: var(--success); }
  .btn-edit { background: var(--surface2); color: var(--muted); }
  .btn-delete { background: var(--danger-dim); color: var(--danger); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost   { background: var(--surface2); color: var(--text); }

  /* ─── BALANCE CARD ─── */
  .balance-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    flex-wrap: wrap;
  }
  .balance-label { font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
  .balance-amount {
    font-family: var(--mono);
    font-size: 36px;
    font-weight: 600;
    letter-spacing: -1px;
  }
  .balance-amount.red { color: var(--danger); }
  .balance-amount.green { color: var(--success); }
  .balance-amount.muted { color: var(--muted); }

  .balance-stats { display: flex; gap: 24px; }
  .balance-stat { text-align: right; }
  .balance-stat-label { font-size: 12px; color: var(--muted); }
  .balance-stat-val { font-family: var(--mono); font-size: 17px; font-weight: 600; margin-top: 2px; }

  /* ─── HISTORY ─── */
  .section-title { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }
  #tx-list { display: flex; flex-direction: column; gap: 6px; }

  .tx-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    gap: 12px;
    transition: background 0.12s;
  }
  .tx-item:hover { background: var(--surface2); }

  .tx-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .tx-dot.debt { background: var(--danger); }
  .tx-dot.pay  { background: var(--success); }

  .tx-body { flex: 1; }
  .tx-comment { font-size: 14px; }
  .tx-date    { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .tx-amount { font-family: var(--mono); font-size: 15px; font-weight: 600; white-space: nowrap; }
  .tx-amount.debt { color: var(--danger); }
  .tx-amount.pay  { color: var(--success); }

  .tx-delete-btn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 15px; padding: 4px 6px;
    border-radius: 5px; transition: color 0.12s, background 0.12s;
  }
  .tx-delete-btn:hover { color: var(--danger); background: var(--danger-dim); }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; }

  /* ─── MODAL ─── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    animation: fadeIn 0.15s;
  }
  @keyframes fadeIn { from { opacity: 0; } }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 400px;
    max-width: calc(100vw - 32px);
    animation: slideUp 0.15s;
  }
  @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } }

  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
  .modal-field { margin-bottom: 14px; }
  .modal-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.6px; display: block; }
  .modal-input, .modal-textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .modal-input:focus, .modal-textarea:focus { border-color: var(--accent); }
  .modal-textarea { resize: vertical; min-height: 76px; }

  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* ─── DEBTORS PAGE ─── */
  #debtors-view { flex: 1; padding: 32px; }
  .dv-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .dv-title { font-size: 24px; font-weight: 700; }
  .sort-controls { display: flex; gap: 6px; }
  .sort-btn {
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    transition: all 0.12s;
  }
  .sort-btn.active, .sort-btn:hover { border-color: var(--accent); color: var(--accent); }

  .debtor-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: background 0.12s;
    gap: 12px;
  }
  .debtor-row:hover { background: var(--surface2); }
  .debtor-name { font-size: 15px; font-weight: 500; }
  .debtor-phone { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .debtor-right { text-align: right; }
  .debtor-debt-val { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--danger); }
  .debtor-last { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ─── NAV TABS ─── */
  .nav-tabs { display: flex; gap: 2px; padding: 16px 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 0; }
  .nav-tab {
    padding: 9px 14px;
    font-size: 13px; font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.12s, border-color 0.12s;
    white-space: nowrap;
  }
  .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .nav-tab:hover:not(.active) { color: var(--text); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 640px) {
    #sidebar { width: 220px; }
    #client-view { padding: 20px; }
    #debtors-view { padding: 20px; }
    .balance-amount { font-size: 26px; }
  }
</style>
</head>
<body>

<div id="app">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">📒</div>
      DebtBook
    </div>
    <div class="sidebar-search">
      <input id="search-input" class="search-input" placeholder="Поиск клиента..." autocomplete="off">
    </div>
    <div class="nav-tabs" style="padding: 8px 8px 0; border-bottom: none; margin-bottom: 4px;">
      <div class="nav-tab active" id="tab-all" onclick="switchTab('all')">Все</div>
      <div class="nav-tab" id="tab-debtors" onclick="switchTab('debtors')">Должники</div>
    </div>
    <div class="sidebar-section-label" id="list-label">КЛИЕНТЫ</div>
    <div id="client-list"></div>
    <button class="sidebar-add-btn" onclick="openAddClient()">+ Добавить клиента</button>
  </div>

  <!-- MAIN -->
  <div id="main">
    <!-- WELCOME -->
    <div id="welcome">
      <div class="welcome-icon">📒</div>
      <div class="welcome-title">Выберите клиента</div>
      <div class="welcome-sub">Найдите клиента через поиск или выберите из списка слева, чтобы начать работу.</div>
    </div>

    <!-- CLIENT VIEW -->
    <div id="client-view" style="display:none;">
      <div class="cv-header">
        <div>
          <div class="cv-name" id="cv-name">Имя клиента</div>
          <div class="cv-meta" id="cv-meta"></div>
        </div>
        <div class="cv-actions">
          <button class="btn btn-debt" onclick="openAddDebt()">+ Долг</button>
          <button class="btn btn-pay"  onclick="openAddPayment()">+ Оплата</button>
          <button class="btn btn-edit" onclick="openEditClient()">✏️ Изм.</button>
          <button class="btn btn-delete" onclick="deleteClient()">🗑</button>
        </div>
      </div>

      <div class="balance-card">
        <div>
          <div class="balance-label">Текущий долг</div>
          <div class="balance-amount" id="cv-balance">0</div>
        </div>
        <div class="balance-stats">
          <div class="balance-stat">
            <div class="balance-stat-label">Всего взято</div>
            <div class="balance-stat-val" id="cv-total-debt" style="color:var(--danger)">0</div>
          </div>
          <div class="balance-stat">
            <div class="balance-stat-label">Всего оплачено</div>
            <div class="balance-stat-val" id="cv-total-paid" style="color:var(--success)">0</div>
          </div>
        </div>
      </div>

      <div class="section-title">История операций</div>
      <div id="tx-list"></div>
    </div>

    <!-- DEBTORS VIEW -->
    <div id="debtors-view" style="display:none;">
      <div class="dv-header">
        <div class="dv-title">Должники</div>
        <div class="sort-controls">
          <button class="sort-btn active" id="sort-debt" onclick="setSort('debt')">По долгу</button>
          <button class="sort-btn" id="sort-name" onclick="setSort('name')">По имени</button>
          <button class="sort-btn" id="sort-date" onclick="setSort('date')">По дате</button>
        </div>
      </div>
      <div id="debtors-list"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay" style="display:none;" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-title" id="modal-title">Заголовок</div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" id="modal-ok">Сохранить</button>
    </div>
  </div>
</div>

<script>

const APP_LOGIN = "Strike001";
const APP_PASSWORD = "Strike2808";

function checkLogin() {
  const logged = sessionStorage.getItem("debtbook_login");

  if (logged === "true") {
    return true;
  }

  const login = prompt("Введите логин:");
  const password = prompt("Введите пароль:");

  if (login === APP_LOGIN && password === APP_PASSWORD) {
    sessionStorage.setItem("debtbook_login", "true");
    return true;
  }

  document.body.innerHTML = `
    <div style="
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#0f1117;
      color:white;
      font-family:sans-serif;
      font-size:24px;
    ">
      Доступ запрещён
    </div>
  `;

  return false;
}

/* ═══════════════════════════════════════════
   DATA LAYER (localStorage)
══════════════════════════════════════════════ */
let db = { clients: [], transactions: [] };

function loadDB() {
  const raw = localStorage.getItem('debtbook_v1');
  if (raw) db = JSON.parse(raw);
  else seedDemo();
}

function saveDB() {
  localStorage.setItem('debtbook_v1', JSON.stringify(db));
}

function seedDemo() {
  const c1 = addClient({ name: 'Алишер Каримов', phone: '+998 90 123-45-67', address: 'ул. Навои 12', notes: 'Постоянный покупатель' });
  const c2 = addClient({ name: 'Нилуфар Рашидова', phone: '+998 93 987-65-43', address: '', notes: '' });
  const c3 = addClient({ name: 'Бобур Тошматов', phone: '+998 91 555-11-22', address: 'пр. Амира Темура 5', notes: '' });

  addTx({ clientId: c1.id, type: 'debt', amount: 120000, comment: 'Хлеб, масло, сахар', date: '2026-06-10' });
  addTx({ clientId: c1.id, type: 'payment', amount: 40000, comment: '', date: '2026-06-13' });
  addTx({ clientId: c1.id, type: 'debt', amount: 50000, comment: 'Мука, рис', date: '2026-06-15' });

  addTx({ clientId: c2.id, type: 'debt', amount: 85000, comment: 'Молоко, творог, яйца', date: '2026-06-12' });
  addTx({ clientId: c2.id, type: 'payment', amount: 85000, comment: '', date: '2026-06-14' });

  addTx({ clientId: c3.id, type: 'debt', amount: 200000, comment: 'Масло подсолнечное 5л, сахар 2кг', date: '2026-06-08' });
  addTx({ clientId: c3.id, type: 'payment', amount: 50000, comment: '', date: '2026-06-11' });
  saveDB();
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function addClient(data) {
  const c = { id: genId(), name: data.name, phone: data.phone, address: data.address, notes: data.notes };
  db.clients.push(c);
  return c;
}

function addTx(data) {
  const t = { id: genId(), clientId: data.clientId, type: data.type, amount: Number(data.amount), comment: data.comment, date: data.date };
  db.transactions.push(t);
  return t;
}

function getClientBalance(clientId) {
  const txs = db.transactions.filter(t => t.clientId === clientId);
  const totalDebt = txs.filter(t => t.type === 'debt').reduce((s, t) => s + t.amount, 0);
  const totalPaid = txs.filter(t => t.type === 'payment').reduce((s, t) => s + t.amount, 0);
  return { balance: totalDebt - totalPaid, totalDebt, totalPaid };
}

function getLastTxDate(clientId) {
  const txs = db.transactions.filter(t => t.clientId === clientId);
  if (!txs.length) return null;
  return txs.reduce((latest, t) => t.date > latest ? t.date : latest, txs[0].date);
}

/* ═══════════════════════════════════════════
   FORMATTING
══════════════════════════════════════════════ */
function fmt(n) {
  return new Intl.NumberFormat('ru-RU').format(n) + ' сум';
}
function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${parseInt(day)} ${months[parseInt(m)-1]} ${y}`;
}

/* ═══════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let selectedClientId = null;
let currentTab = 'all'; // 'all' | 'debtors'
let currentSort = 'debt';
let searchQuery = '';

/* ═══════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════════ */
function renderSidebar() {
  const q = searchQuery.trim().toLowerCase();
  let clients = db.clients.filter(c => !q || c.name.toLowerCase().includes(q) || c.phone.includes(q));

  if (currentTab === 'debtors') {
    clients = clients.filter(c => getClientBalance(c.id).balance > 0);
    document.getElementById('list-label').textContent = 'ДОЛЖНИКИ';
  } else {
    document.getElementById('list-label').textContent = 'КЛИЕНТЫ';
  }

  const el = document.getElementById('client-list');
  if (!clients.length) {
    el.innerHTML = '<div style="padding:24px 16px;text-align:center;color:var(--muted);font-size:13px;">Не найдено</div>';
    return;
  }

  el.innerHTML = clients.map(c => {
    const { balance } = getClientBalance(c.id);
    const active = c.id === selectedClientId ? ' active' : '';
    const debtHtml = balance > 0
      ? `<span class="client-item-debt debt-positive">${fmt(balance)}</span>`
      : `<span class="client-item-debt debt-zero">—</span>`;
    return `<div class="client-item${active}" onclick="selectClient('${c.id}')">
      <span class="client-item-name">${esc(c.name)}</span>
      ${debtHtml}
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════
   CLIENT VIEW
══════════════════════════════════════════════ */
function selectClient(id) {
  selectedClientId = id;
  showView('client');
  renderSidebar();
  renderClientView();
}

function renderClientView() {
  const c = db.clients.find(x => x.id === selectedClientId);
  if (!c) return;

  const { balance, totalDebt, totalPaid } = getClientBalance(c.id);
  document.getElementById('cv-name').textContent = c.name;

  let meta = c.phone || '';
  if (c.address) meta += (meta ? '  ·  ' : '') + c.address;
  document.getElementById('cv-meta').textContent = meta;

  const balEl = document.getElementById('cv-balance');
  balEl.textContent = fmt(balance);
  balEl.className = 'balance-amount ' + (balance > 0 ? 'red' : balance < 0 ? 'green' : 'muted');

  document.getElementById('cv-total-debt').textContent = fmt(totalDebt);
  document.getElementById('cv-total-paid').textContent = fmt(totalPaid);

  // Transactions
  const txs = db.transactions
    .filter(t => t.clientId === selectedClientId)
    .sort((a, b) => b.date.localeCompare(a.date));

  const txList = document.getElementById('tx-list');
  if (!txs.length) {
    txList.innerHTML = '<div class="empty-state">Операций пока нет</div>';
    return;
  }

  txList.innerHTML = txs.map(t => {
    const sign = t.type === 'debt' ? '+' : '−';
    const cls = t.type === 'debt' ? 'debt' : 'pay';
    const comment = t.comment || (t.type === 'debt' ? 'Долг' : 'Оплата');
    return `<div class="tx-item">
      <div class="tx-dot ${cls}"></div>
      <div class="tx-body">
        <div class="tx-comment">${esc(comment)}</div>
        <div class="tx-date">${fmtDate(t.date)}</div>
      </div>
      <div class="tx-amount ${cls}">${sign} ${fmt(t.amount)}</div>
      <button class="tx-delete-btn" title="Удалить" onclick="deleteTx('${t.id}')">✕</button>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════
   DEBTORS VIEW
══════════════════════════════════════════════ */
function renderDebtorsView() {
  let debtors = db.clients
    .map(c => ({ c, ...getClientBalance(c.id), last: getLastTxDate(c.id) }))
    .filter(x => x.balance > 0);

  if (currentSort === 'debt') debtors.sort((a, b) => b.balance - a.balance);
  else if (currentSort === 'name') debtors.sort((a, b) => a.c.name.localeCompare(b.c.name, 'ru'));
  else debtors.sort((a, b) => (b.last || '').localeCompare(a.last || ''));

  const el = document.getElementById('debtors-list');
  if (!debtors.length) {
    el.innerHTML = '<div class="empty-state" style="margin-top:40px;">Должников нет 🎉</div>';
    return;
  }

  el.innerHTML = debtors.map(({ c, balance, last }) => `
    <div class="debtor-row" onclick="selectClient('${c.id}')">
      <div>
        <div class="debtor-name">${esc(c.name)}</div>
        <div class="debtor-phone">${esc(c.phone)}</div>
      </div>
      <div class="debtor-right">
        <div class="debtor-debt-val">${fmt(balance)}</div>
        <div class="debtor-last">${last ? fmtDate(last) : ''}</div>
      </div>
    </div>`).join('');
}

/* ═══════════════════════════════════════════
   TABS & SORT
══════════════════════════════════════════════ */
function switchTab(tab) {
  currentTab = tab;
  ['all','debtors'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  renderSidebar();
}

function setSort(s) {
  currentSort = s;
  ['debt','name','date'].forEach(k => document.getElementById('sort-' + k).classList.toggle('active', k === s));
  renderDebtorsView();
}

function showView(name) {
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('client-view').style.display = 'none';
  document.getElementById('debtors-view').style.display = 'none';

  if (name === 'client') document.getElementById('client-view').style.display = '';
  else if (name === 'debtors') document.getElementById('debtors-view').style.display = '';
  else document.getElementById('welcome').style.display = '';
}

/* ═══════════════════════════════════════════
   MODALS
══════════════════════════════════════════════ */
function openModal(title, bodyHtml, okLabel, okFn) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-ok').textContent = okLabel;
  document.getElementById('modal-ok').onclick = okFn;
  document.getElementById('modal-overlay').style.display = 'flex';
  setTimeout(() => document.querySelector('.modal-input, .modal-textarea')?.focus(), 50);
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').style.display = 'none';
}

function clientFormHtml(c) {
  return `
    <div class="modal-field"><label class="modal-label">Имя *</label>
      <input class="modal-input" id="f-name" value="${c ? esc(c.name) : ''}" placeholder="Имя клиента"></div>
    <div class="modal-field"><label class="modal-label">Телефон</label>
      <input class="modal-input" id="f-phone" value="${c ? esc(c.phone) : ''}" placeholder="+998 90 ..."></div>
    <div class="modal-field"><label class="modal-label">Адрес</label>
      <input class="modal-input" id="f-address" value="${c ? esc(c.address) : ''}" placeholder="Необязательно"></div>
    <div class="modal-field"><label class="modal-label">Примечание</label>
      <textarea class="modal-textarea" id="f-notes" placeholder="Необязательно">${c ? esc(c.notes) : ''}</textarea></div>`;
}

function openAddClient() {
  openModal('Новый клиент', clientFormHtml(null), 'Добавить', () => {
    const name = document.getElementById('f-name').value.trim();
    if (!name) return alert('Введите имя');
    addClient({ name, phone: document.getElementById('f-phone').value.trim(),
      address: document.getElementById('f-address').value.trim(),
      notes: document.getElementById('f-notes').value.trim() });
    saveDB(); renderSidebar();
    closeModal();
  });
}

function openEditClient() {
  const c = db.clients.find(x => x.id === selectedClientId);
  if (!c) return;
  openModal('Изменить клиента', clientFormHtml(c), 'Сохранить', () => {
    const name = document.getElementById('f-name').value.trim();
    if (!name) return alert('Введите имя');
    c.name = name;
    c.phone = document.getElementById('f-phone').value.trim();
    c.address = document.getElementById('f-address').value.trim();
    c.notes = document.getElementById('f-notes').value.trim();
    saveDB(); renderSidebar(); renderClientView();
    closeModal();
  });
}

function deleteClient() {
  const c = db.clients.find(x => x.id === selectedClientId);
  if (!confirm(`Удалить клиента "${c.name}"? Все операции будут удалены.`)) return;
  db.clients = db.clients.filter(x => x.id !== selectedClientId);
  db.transactions = db.transactions.filter(t => t.clientId !== selectedClientId);
  selectedClientId = null;
  saveDB(); renderSidebar(); showView('welcome');
}

function txFormHtml(type) {
  const today = new Date().toISOString().split('T')[0];
  return `
    <div class="modal-field"><label class="modal-label">Сумма (сум) *</label>
      <input class="modal-input" id="f-amount" type="number" min="1" placeholder="0"></div>
    <div class="modal-field"><label class="modal-label">Дата</label>
      <input class="modal-input" id="f-date" type="date" value="${today}"></div>
    <div class="modal-field"><label class="modal-label">${type === 'debt' ? 'Что взяли' : 'Комментарий'}</label>
      <textarea class="modal-textarea" id="f-comment" placeholder="${type === 'debt' ? 'Хлеб, масло...' : 'Необязательно'}"></textarea></div>`;
}

function openAddDebt() {
  openModal('Добавить долг', txFormHtml('debt'), 'Добавить', () => {
    const amt = Number(document.getElementById('f-amount').value);
    if (!amt || amt <= 0) return alert('Введите сумму');
    addTx({ clientId: selectedClientId, type: 'debt', amount: amt,
      comment: document.getElementById('f-comment').value.trim(),
      date: document.getElementById('f-date').value });
    saveDB(); renderSidebar(); renderClientView();
    closeModal();
  });
}

function openAddPayment() {
  openModal('Добавить оплату', txFormHtml('payment'), 'Сохранить', () => {
    const amt = Number(document.getElementById('f-amount').value);
    if (!amt || amt <= 0) return alert('Введите сумму');
    addTx({ clientId: selectedClientId, type: 'payment', amount: amt,
      comment: document.getElementById('f-comment').value.trim(),
      date: document.getElementById('f-date').value });
    saveDB(); renderSidebar(); renderClientView();
    closeModal();
  });
}

function deleteTx(txId) {
  if (!confirm('Удалить эту операцию?')) return;
  db.transactions = db.transactions.filter(t => t.id !== txId);
  saveDB(); renderSidebar(); renderClientView();
}

/* ═══════════════════════════════════════════
   UTIL
══════════════════════════════════════════════ */
function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ═══════════════════════════════════════════
   SEARCH
══════════════════════════════════════════════ */
document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderSidebar();
});

/* ═══════════════════════════════════════════
   KEYBOARD
══════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* ═══════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */

if (checkLogin()) {
  loadDB();
  renderSidebar();
}

</script>
</body>
</html>
